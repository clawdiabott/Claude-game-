name: Build & Deploy Unity WebGL

on:
  push:
    branches: [claude/office-chair-racing-game-ntxEL]
    paths:
      - 'unity/ChairGP/**'
      - '.github/workflows/unity-build.yml'
  workflow_dispatch:   # also allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      # ── 2. Cache Unity Library (speeds up repeat builds massively) ───────────
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/ChairGP/Library
          key: Library-ChairGP-${{ hashFiles('unity/ChairGP/Assets/**', 'unity/ChairGP/Packages/**', 'unity/ChairGP/ProjectSettings/**') }}
          restore-keys: |
            Library-ChairGP-
            Library-

      # ── 3. Build with game-ci/unity-builder ──────────────────────────────────
      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:       unity/ChairGP
          targetPlatform:    WebGL
          unityVersion:      6000.0.29f1
          buildName:         ChairGP
          buildsPath:        build
          # Run the SceneBuilder menu item before building so the scene is fresh
          customParameters:  -executeMethod SceneBuilder.BuildTrack0Auto -quit -batchmode

      # ── 4. Upload artifact (optional – lets you download the build zip) ──────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChairGP-WebGL
          path: build/WebGL/ChairGP
          retention-days: 7

      # ── 5. Deploy to GitHub Pages (gh-pages branch) ──────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token:   ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir:    build/WebGL/ChairGP
          force_orphan:   false
          keep_files:     false
          commit_message: "Deploy Unity WebGL build [skip ci]"
